# Een minuutje kijken of de bodem klopt: pakketten ophalen, icoon tekenen, en
# vertellen wat er staat. Bouwt niets. Bedoeld om te zien of een mislukking aan
# de installatie ligt of aan het bouwen zelf.
#
# Starten: tabblad Actions -> Rooktest -> Run workflow.

name: Rooktest

on:
  workflow_dispatch:

jobs:
  kijken:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Wat draait hier
        shell: bash
        run: |
          echo "os:   $RUNNER_OS"
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"

      - name: Versies gelijk?
        shell: bash
        run: |
          node -e "const p=require('./package.json'),l=require('./package-lock.json');console.log('package.json',p.version,'| lock',l.version,'|',p.version===l.version?'gelijk':'SCHEEF')"

      - name: Pakketten ophalen
        run: npm ci

      - name: Staat Electron er
        shell: bash
        run: node -e "console.log('electron:', require('electron'))"

      - name: Icoon tekenen
        run: node scripts/make-icon.js

      - name: Wat ligt er nu
        shell: bash
        run: ls -la build/
