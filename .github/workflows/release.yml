# Builds Hushfall and puts the files on GitHub as a release. The app out in the field watches that
# spot itself and updates on its own. Runs on a tag (v1.0.11) or by hand from the Actions tab.
#
# Building and publishing are separated on purpose. If you let electron-builder publish, it created
# a release per file whenever one was not there yet - and because it uploads the files in parallel,
# you ended up with two releases carrying the same label, each holding half of it. Now the jobs only
# build and keep what they made, and one last job puts everything in place in one go.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to create a release and upload the files

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Electron itself (over 100 MB per architecture) comes from a server that
      # hands out the odd 504. Whatever was fetched once stays here.
      - uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # No bump here: the version in package.json leads and is already in the tag.
      - name: Build (with another go at a stalling download)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx electron-builder --win --publish never && exit 0
            echo "attempt $attempt stalled - waiting, then trying again"
            sleep 30
          done
          exit 1
      - name: What came out
        if: always()
        shell: bash
        run: ls -la dist/ || echo "no dist folder"
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: build-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  # The Mac version. GitHub keeps Macs around, so you do not need one of your own. The app is
  # ad-hoc signed (see build/after-pack.cjs): free, and enough to be allowed to start on Apple
  # Silicon. Real notarisation needs an Apple account at $99 a year; without it you grant permission
  # yourself the first time through System Settings > Privacy & Security.
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Electron itself (over 100 MB per architecture) comes from a server that
      # hands out the odd 504. Whatever was fetched once stays here.
      - uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: node scripts/make-icon.js
      - name: Build (with another go at a stalling download)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx electron-builder --mac --publish never && exit 0
            echo "attempt $attempt stalled - waiting, then trying again"
            sleep 30
          done
          exit 1
        env:
          # With no Apple certificate there is no identity to sign with; we do it ad-hoc ourselves
          # after packing. Leave this out and electron-builder goes looking for one anyway.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: What came out
        if: always()
        shell: bash
        run: ls -la dist/ || echo "no dist folder"
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: build-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  # The MSIX package for the Microsoft Store. A separate job on purpose: this package does not
  # update itself (the Store does that) and does not fetch sounds from sources that forbid
  # commercial use. The GitHub runner already has the Windows SDK, so makeappx.exe is available
  # there; on an ordinary workstation you have to install that SDK yourself first.
  store:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/make-icon.js
      - run: npx electron-builder --win appx --publish never
      # The package is not published but kept as a file: submitting to the Store is something you
      # do yourself through Partner Center, and that comes with a manual review.
      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: hushfall-msix
          path: dist/*.appx

  # One job, one release. This is where everything Windows and Mac made comes together.
  publish:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: build-*
          merge-multiple: true
          path: release-files
      - name: What is going out
        run: ls -la release-files/
      - uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          draft: false
          generate_release_notes: true
