# Bouwt Hushfall en zet de bestanden als release op GitHub. De app in het veld kijkt daar zelf naar
# en werkt zichzelf bij. Draait bij een tag (v1.0.11) of handmatig via de Actions-tab.
#
# Het bouwen en het publiceren zijn met opzet gescheiden. Liet je electron-builder zelf publiceren,
# dan maakte hij per bestand een release aan als die er nog niet stond - en omdat hij de bestanden
# tegelijk uploadt, ontstonden er twee releases met hetzelfde label, elk met de helft erin. Nu
# bouwen de taken alleen, bewaren ze wat ze maken, en zet een laatste taak alles in een keer neer.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # nodig om een release aan te maken en de bestanden te uploaden

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Geen bump hier: het versienummer in package.json is leidend en staat al in de tag.
      - run: npx electron-builder --win --publish never
      - name: Wat is er gemaakt
        if: always()
        shell: bash
        run: ls -la dist/ || echo "geen dist-map"
      - uses: actions/upload-artifact@v7
        with:
          name: bouwsel-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  # De Mac-versie. GitHub heeft Macs staan, dus een eigen Mac is niet nodig. De app wordt ad-hoc
  # ondertekend (zie build/na-verpakken.cjs): gratis, en genoeg om te mogen starten op Apple Silicon.
  # Een echte notarisatie vraagt een Apple-account van $99 per jaar; zonder dat geef je de eerste
  # keer zelf toestemming via Systeeminstellingen > Privacy en beveiliging.
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/make-icon.js
      - run: npx electron-builder --mac --publish never
        env:
          # Zonder Apple-certificaat valt er niets te ondertekenen met een identiteit; we doen het
          # zelf ad-hoc na het inpakken. Laat je dit weg, dan gaat electron-builder alsnog zoeken.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Wat is er gemaakt
        if: always()
        shell: bash
        run: ls -la dist/ || echo "geen dist-map"
      - uses: actions/upload-artifact@v7
        with:
          name: bouwsel-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  # Het MSIX-pakket voor de Microsoft Store. Bewust een aparte taak: dit pakket werkt zichzelf niet
  # bij (dat doet de Store) en haalt geen geluiden op bij bronnen die commercieel gebruik verbieden.
  # De runner van GitHub heeft de Windows SDK al staan, dus makeappx.exe is daar beschikbaar;
  # op een gewone werkplek moet je die SDK eerst zelf installeren.
  store:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/make-icon.js
      - run: npx electron-builder --win appx --publish never
      # Het pakket wordt niet gepubliceerd maar als bestand bewaard: inleveren bij de Store doe je
      # zelf via Partner Center, en daar hoort een handmatige controle bij.
      - uses: actions/upload-artifact@v7
        with:
          name: hushfall-msix
          path: dist/*.appx

  # Een taak, een release. Hier komt alles samen wat Windows en Mac hebben gemaakt.
  uitgeven:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: bouwsel-*
          merge-multiple: true
          path: uitgifte
      - name: Wat gaat eruit
        run: ls -la uitgifte/
      - uses: softprops/action-gh-release@v3
        with:
          files: uitgifte/*
          draft: false
          generate_release_notes: true
