# A minute's look at whether the ground is solid: fetch the packages, draw the
# icon, and report what is there. Builds nothing. Meant to tell whether a
# failure is down to the install or to the build itself.
#
# To start: Actions tab -> Smoke test -> Run workflow.

name: Smoke test

on:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: What is running here
        shell: bash
        run: |
          echo "os:   $RUNNER_OS"
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"

      - name: Versions in step?
        shell: bash
        run: |
          node -e "const p=require('./package.json'),l=require('./package-lock.json');console.log('package.json',p.version,'| lock',l.version,'|',p.version===l.version?'same':'OUT OF STEP')"

      - name: Fetch packages
        run: npm ci

      - name: Is Electron there
        shell: bash
        run: node -e "console.log('electron:', require('electron'))"

      - name: Draw the icon
        run: node scripts/make-icon.js

      - name: What is there now
        shell: bash
        run: ls -la build/
